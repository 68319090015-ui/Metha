<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP8266 Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #020617);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .panel {
      background: #020617;
      width: 350px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: black;
      transition: 0.2s;
    }

    button:hover {
      background: #16a34a;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .danger:hover {
      background: #dc2626;
    }

    .info {
      background: #38bdf8;
      color: black;
    }

    .info:hover {
      background: #0ea5e9;
    }

    footer {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>ESP8266 Control</h2>

    <!-- ส่งข้อความ -->
    <input id="msg" type="text" placeholder="Enter message for LCD">
    <button onclick="sendText()">Send Text to LCD</button>

    <!-- เมนู -->
    <button class="info" onclick="sendCmd('/time')">Show Time</button>
    <button onclick="sendCmd('/ledon')">LED ON</button>
    <button class="danger" onclick="sendCmd('/ledoff')">LED OFF</button>

    <footer>
      ESP8266 Web Control<br>
      GitHub Pages Compatible
    </footer>
  </div>

  <script>
    // เปลี่ยน IP ให้ตรงกับ ESP8266
    const ESP_IP = "http://192.168.4.1";

    function sendCmd(path) {
      fetch(ESP_IP + path)
        .catch(err => console.log(err));
    }

    function sendText() {
      const msg = document.getElementById("msg").value;
      if (msg.length === 0) return;
      fetch(ESP_IP + "/text?msg=" + encodeURIComponent(msg))
        .catch(err => console.log(err));
    }
  </script>
</body>
</html>
